name: Project tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Run tests
        run: python -m pytest -q
      - name: Run frontend tests
        run: npm test

  evidence:
    runs-on: ubuntu-24.04
    env:
      APP_PATH: core # Relative to project/; adapt if the application adds packages.
      DJANGO_SETTINGS_MODULE: config.quality_test_settings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.PROJECT_PYTHON_VERSION }}
      # Current five teams keep requirements.txt and manage.py inside project/.
      - name: Install app dependencies and compatible quality tools
        run: |
          python -m pip install -r project/requirements.txt -r requirements-quality.txt
          python -m pip check
      - name: Test supplied reporter with mocks
        run: python -m unittest discover -s tests -p test_quality_report.py -v
      # Team 3: enable this block after repairing its package-lock.json/test path.
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '22.12.0'
      # - name: Team 3 JavaScript checks
      #   working-directory: project
      #   run: |
      #     npm ci
      #     npm test
      #     npm run build
      - name: Collect real application evidence
        working-directory: project
        run: python ../scripts/collect_quality.py "$APP_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: project/quality-evidence/
          if-no-files-found: error