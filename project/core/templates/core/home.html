<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encounter Helper</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#17161b; --slate:#24232b; --bone:#e8e2d4; --blood:#b3392f; --brass:#c9a24a; --moss:#5f8a5b; }
  body { background: var(--ink); color: var(--bone); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  h1,h2,h3,h4,h5,.card-title { font-family: 'Alegreya', Georgia, serif; }
  .topbar { background: var(--slate); border-bottom: 1px solid #3a3944; }
  .main { flex: 1; min-height: 0; display: flex; }
  .left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .board { flex: 1; position: relative; overflow: auto; background:
      radial-gradient(circle at 1px 1px, #2c2b34 1px, transparent 0) 0 0 / 24px 24px; }
  .actions { background: var(--slate); border-top: 1px solid #3a3944; padding: .75rem; }
  .side { width: 340px; background: var(--slate); border-left: 1px solid #3a3944; display: flex; flex-direction: column; }
  .side-body { flex: 1; overflow-y: auto; padding: .75rem; }
  @media (max-width: 800px) { .main { flex-direction: column; } .side { width: 100%; height: 40%; border-left: 0; border-top: 1px solid #3a3944; } }

  .combatant { position: absolute; width: 210px; cursor: grab; user-select: none; touch-action: none;
      background: var(--slate); border: 2px solid #44434f; border-radius: 4px; padding: .6rem .75rem; }
  .combatant.player { border-left: 6px solid var(--moss); }
  .combatant.enemy  { border-left: 6px solid var(--blood); }
  .combatant.selected { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(201,162,74,.35); }
  .combatant.targetable { border-color: var(--blood); cursor: crosshair; }
  .combatant.dead { opacity: .45; }
  .combatant.dead .name { text-decoration: line-through; }
  .combatant.dragging { cursor: grabbing; z-index: 50; }
  .hp-track { height: 8px; background: #111; border-radius: 4px; overflow: hidden; }
  .hp-fill { height: 100%; background: var(--moss); transition: width .3s; }
  .init-badge { position: absolute; top: -10px; right: -10px; background: var(--brass); color: #111; font-weight: 700;
      border-radius: 50%; width: 28px; height: 28px; display: grid; place-items: center; font-size: .85rem; }
  .log-entry { border-bottom: 1px solid #3a3944; padding: .4rem 0; font-size: .92rem; }
  .log-entry .roll { color: var(--brass); font-weight: 700; }
  .log-entry.hit { border-left: 3px solid var(--blood); padding-left: .5rem; }
  .log-entry.miss { border-left: 3px solid #666; padding-left: .5rem; color: #aaa; }
  .btn-brass { background: var(--brass); color: #111; border: 0; }
  .btn-brass:hover { background: #dbb55c; color: #111; }
  .nav-tabs .nav-link.active { background: var(--ink); }
</style>
</head>
<body>

<div class="topbar d-flex align-items-center px-3 py-2 gap-3">
  <h1 class="h4 m-0">Encounter Helper</h1>
  <input id="encounterName" class="form-control form-control-sm w-auto" value="Goblin Ambush" aria-label="Encounter name">
  <span id="turnInfo" class="ms-auto small text-secondary">Roll initiative to begin</span>
</div>

<div class="main">
  <div class="left">
    <div class="board" id="board">
      <div id="emptyMsg" class="position-absolute top-50 start-50 translate-middle text-secondary text-center">
        <p class="mb-1">No combatants yet.</p>
        <p class="small">Use "Add combatant" below to create players and enemies.</p>
      </div>
    </div>

    <div class="actions d-flex flex-wrap gap-2 align-items-center">
      <button class="btn btn-brass" data-bs-toggle="modal" data-bs-target="#addModal">Add combatant</button>
      <button class="btn btn-outline-light" id="initBtn">Roll initiative</button>
      <button class="btn btn-danger" id="attackBtn" disabled>Attack</button>
      <button class="btn btn-outline-light" id="nextBtn" disabled>Next turn</button>
      <span id="hint" class="small text-secondary ms-2"></span>
      <button class="btn btn-sm btn-outline-secondary ms-auto" id="resetBtn">Clear encounter</button>
    </div>
  </div>

  <aside class="side">
    <ul class="nav nav-tabs px-2 pt-2" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#logTab">Log</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#questTab">Quests</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#aiTab">AI DM</button></li>
    </ul>
    <div class="tab-content side-body">
      <div class="tab-pane fade show active" id="logTab"><div id="log"></div></div>
      <div class="tab-pane fade" id="questTab">
        <form id="questForm" class="input-group mb-3">
          <input id="questInput" class="form-control" placeholder="New quest or note" required>
          <button class="btn btn-brass">Add</button>
        </form>
        <ul id="quests" class="list-group"></ul>
      </div>
      <div class="tab-pane fade" id="aiTab">
        <p class="text-secondary">The AI DM chat will go here in a later sprint.</p>
        <input class="form-control" placeholder="Ask the DM..." disabled>
      </div>
    </div>
  </aside>
</div>

<!-- Add combatant modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="addForm">
      <div class="modal-header"><h5 class="modal-title">Add combatant</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body row g-3">
        <div class="col-8"><label class="form-label">Name</label><input name="name" class="form-control" required></div>
        <div class="col-4"><label class="form-label">Type</label>
          <select name="type" class="form-select"><option value="player">Player</option><option value="enemy" selected>Enemy</option></select></div>
        <div class="col-4"><label class="form-label">Max HP</label><input name="hp" type="number" min="1" value="10" class="form-control" required></div>
        <div class="col-4"><label class="form-label">Armor class</label><input name="ac" type="number" min="1" value="12" class="form-control" required></div>
        <div class="col-4"><label class="form-label">Initiative bonus</label><input name="init" type="number" value="0" class="form-control"></div>
        <div class="col-6"><label class="form-label">Attack bonus</label><input name="atk" type="number" value="3" class="form-control"></div>
        <div class="col-6"><label class="form-label">Damage dice</label><input name="dmg" value="1d6+1" pattern="\d+d\d+([+-]\d+)?" class="form-control" title="Example: 1d8+3"></div>
      </div>
      <div class="modal-footer"><button class="btn btn-brass">Add to encounter</button></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ---------- State ---------- */
let combatants = [];   // {id,name,type,maxHp,hp,ac,init,atk,dmg,x,y,initRoll}
let selectedId = null; // attacker
let attacking = false; // waiting for a target click
let turnIdx = -1;
let nextId = 1;

const $ = id => document.getElementById(id);
const board = $('board');

/* ---------- Dice ---------- */
const d = sides => Math.floor(Math.random() * sides) + 1;
function rollDamage(expr, crit) {
  const m = expr.match(/^(\d+)d(\d+)([+-]\d+)?$/);
  if (!m) return { total: 1, text: '1' };
  let n = +m[1] * (crit ? 2 : 1), rolls = [];
  for (let i = 0; i < n; i++) rolls.push(d(+m[2]));
  const mod = +(m[3] || 0);
  const total = Math.max(0, rolls.reduce((a, b) => a + b, 0) + mod);
  return { total, text: `[${rolls.join('+')}]${mod ? (mod > 0 ? '+' : '') + mod : ''}` };
}

/* ---------- Log ---------- */
function log(html, cls = '') {
  const el = document.createElement('div');
  el.className = 'log-entry ' + cls;
  el.innerHTML = html;
  $('log').prepend(el);
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Rendering ---------- */
function render() {
  board.querySelectorAll('.combatant').forEach(e => e.remove());
  $('emptyMsg').style.display = combatants.length ? 'none' : '';
  const turnId = combatants[turnIdx]?.id;
  combatants.forEach(c => {
    const el = document.createElement('div');
    el.className = `combatant ${c.type}` + (c.id === selectedId ? ' selected' : '')
      + (c.hp <= 0 ? ' dead' : '') + (attacking && c.id !== selectedId && c.hp > 0 ? ' targetable' : '');
    el.dataset.id = c.id;
    el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
    const pct = Math.max(0, c.hp / c.maxHp * 100);
    el.innerHTML = `
      ${c.initRoll != null ? `<div class="init-badge" title="Initiative">${c.initRoll}</div>` : ''}
      <h5 class="name mb-1">${esc(c.name)}${c.id === turnId ? ' &#9876;' : ''}</h5>
      <div class="small text-secondary mb-2">${c.type === 'player' ? 'Player' : 'Enemy'} &middot; AC ${c.ac}</div>
      <div class="hp-track mb-1"><div class="hp-fill" style="width:${pct}%;${c.type==='enemy'?'background:var(--blood)':''}"></div></div>
      <div class="small">HP ${Math.max(0, c.hp)} / ${c.maxHp}</div>
      <div class="small text-secondary">Hits +${c.atk} for ${esc(c.dmg)}</div>`;
    board.appendChild(el);
  });
  $('attackBtn').disabled = selectedId == null || attacking;
  $('nextBtn').disabled = turnIdx < 0;
  $('hint').textContent = attacking ? 'Click a target.' : selectedId ? 'Attacker selected. Press Attack.' : '';
  const cur = combatants[turnIdx];
  $('turnInfo').textContent = cur ? `Turn: ${cur.name}` : 'Roll initiative to begin';
}

/* ---------- Drag + click on cards ---------- */
let drag = null;
board.addEventListener('pointerdown', e => {
  const el = e.target.closest('.combatant');
  if (!el) return;
  const c = combatants.find(x => x.id == el.dataset.id);
  drag = { c, el, sx: e.clientX, sy: e.clientY, ox: c.x, oy: c.y, moved: false };
  el.setPointerCapture(e.pointerId);
});
board.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  drag.el.classList.add('dragging');
  drag.c.x = Math.max(0, drag.ox + dx);
  drag.c.y = Math.max(0, drag.oy + dy);
  drag.el.style.left = drag.c.x + 'px';
  drag.el.style.top = drag.c.y + 'px';
});
board.addEventListener('pointerup', () => {
  if (!drag) return;
  const { c, moved } = drag; drag = null;
  if (!moved) handleCardClick(c);
  else render();
});

function handleCardClick(c) {
  if (attacking) {
    if (c.id === selectedId || c.hp <= 0) return;
    doAttack(combatants.find(x => x.id === selectedId), c);
    attacking = false;
  } else {
    selectedId = (selectedId === c.id) ? null : c.id;
  }
  render();
}

/* ---------- Combat ---------- */
function doAttack(a, t) {
  const roll = d(20), total = roll + a.atk;
  const nat20 = roll === 20, nat1 = roll === 1;
  const hit = nat20 || (!nat1 && total >= t.ac);
  const head = `<b>${esc(a.name)}</b> attacks <b>${esc(t.name)}</b>: d20 <span class="roll">${roll}</span> + ${a.atk} = <span class="roll">${total}</span> vs AC ${t.ac}`;
  if (!hit) {
    log(`${head}. ${nat1 ? 'Critical miss!' : 'Miss.'}`, 'miss');
    return;
  }
  const dmg = rollDamage(a.dmg, nat20);
  t.hp -= dmg.total;
  log(`${head}. ${nat20 ? 'Critical hit! ' : 'Hit! '}${dmg.text} = <span class="roll">${dmg.total}</span> damage.`
      + (t.hp <= 0 ? ` <b>${esc(t.name)} is down.</b>` : ''), 'hit');
}

$('attackBtn').onclick = () => { attacking = true; render(); };

$('initBtn').onclick = () => {
  if (!combatants.length) return;
  combatants.forEach(c => c.initRoll = d(20) + c.init);
  combatants.sort((a, b) => b.initRoll - a.initRoll);
  turnIdx = 0;
  log('<b>Initiative:</b> ' + combatants.map(c => `${esc(c.name)} ${c.initRoll}`).join(', '));
  render();
};

$('nextBtn').onclick = () => {
  if (!combatants.length) return;
  for (let i = 0; i < combatants.length; i++) {
    turnIdx = (turnIdx + 1) % combatants.length;
    if (combatants[turnIdx].hp > 0) break;
  }
  selectedId = combatants[turnIdx].id; attacking = false;
  render();
};

$('resetBtn').onclick = () => {
  if (!confirm('Remove all combatants and clear the log?')) return;
  combatants = []; selectedId = null; attacking = false; turnIdx = -1; $('log').innerHTML = '';
  render();
};

/* ---------- Add combatant ---------- */
$('addForm').onsubmit = e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const n = combatants.length;
  combatants.push({
    id: nextId++, name: f.name.trim(), type: f.type,
    maxHp: +f.hp, hp: +f.hp, ac: +f.ac, init: +f.init, atk: +f.atk, dmg: f.dmg || '1d6',
    x: 20 + (n % 3) * 230, y: 20 + Math.floor(n / 3) * 190, initRoll: null
  });
  log(`${esc(f.name)} joined the encounter.`);
  e.target.reset();
  bootstrap.Modal.getInstance($('addModal')).hide();
  render();
};

/* ---------- Quests ---------- */
$('questForm').onsubmit = e => {
  e.preventDefault();
  const li = document.createElement('li');
  li.className = 'list-group-item d-flex gap-2 align-items-start';
  li.innerHTML = `<input class="form-check-input mt-1" type="checkbox"><span class="flex-grow-1">${esc($('questInput').value)}</span>
    <button class="btn-close btn-sm" aria-label="Remove"></button>`;
  li.querySelector('input').onchange = ev => li.querySelector('span').classList.toggle('text-decoration-line-through', ev.target.checked);
  li.querySelector('button').onclick = () => li.remove();
  $('quests').appendChild(li);
  $('questInput').value = '';
};

/* ---------- Demo data so it isn't empty on first load ---------- */
[
  ['Aria', 'player', 24, 15, 2, 5, '1d8+3'],
  ['Goblin', 'enemy', 7, 13, 2, 4, '1d6+2'],
  ['Goblin Boss', 'enemy', 21, 15, 1, 4, '1d8+2']
].forEach(([name, type, hp, ac, init, atk, dmg], n) => combatants.push({
  id: nextId++, name, type, maxHp: hp, hp, ac, init, atk, dmg, x: 20 + n * 230, y: 20, initRoll: null
}));
render();
</script>
</body>
</html>
