<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Study Session Tracker</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
        .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
        form p { display: grid; gap: .25rem; }
        input { padding: .5rem; }
        button { padding: .6rem 1rem; cursor: pointer; }
        .empty { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <!-- HW1 Part 2: Change this heading to something of your choice. -->
    <h1>My Study Sessions</h1>

    <section class="card">
        <h2>Add a session</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save session</button>
        </form>
    </section>

    <section>
        <h2>Completed sessions</h2>
        {% for session in sessions %}
            <article class="card">
                <strong>{{ session.topic }}</strong><br>
                <!-- HW1 Part 3: display the new subject here. -->
                {{ session.duration_minutes }} minutes
            </article>
        {% empty %}
            <p class="empty">No study sessions yet.</p>
        {% endfor %}
    </section>
</body>
</html>
